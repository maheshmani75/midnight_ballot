name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: npm install
        run: npm ci

      # The Compact compiler ships as a standalone toolchain from Midnight,
      # not an npm package. Install it via the official installer, then
      # compile the contract into managed/, exactly like a local dev run.
      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/midnightntwrk/compact/main/install.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: compact compile
        run: compact compile contracts/voting.compact managed/voting

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
